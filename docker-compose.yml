version: "3.9"

services:
  kyc-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kyc_verification
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./kyc.db
      - TESSERACT_CMD=/usr/bin/tesseract
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
